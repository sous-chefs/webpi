---
name: "Test"

"on":
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-unit:
    uses: sous-chefs/.github/.github/workflows/lint-unit.yml@9.0.1
    permissions:
      actions: write
      checks: write
      pull-requests: write
      statuses: write
      issues: write

  integration:
    needs: "lint-unit"
    runs-on: windows-latest
    strategy:
      matrix:
        os:
          - windows-latest
        suite:
          - default
      fail-fast: false
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install Chef
        uses: sous-chefs/.github/.github/actions/install-workstation@9.0.1
      - name: Kitchen Test
        shell: pwsh
        env:
          CHEF_LICENSE: accept-no-persist
          KITCHEN_LOCAL_YAML: kitchen.exec.yml
          KITCHEN_INSTANCE: ${{ matrix.suite }}-${{ matrix.os }}
        run: |
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
          chef exec kitchen test $env:KITCHEN_INSTANCE --destroy=always

  final:
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - run: echo "Integration complete"
